modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
authors = "${mod_authors}"
description = '''${mod_description}'''

# Mixin config declaration so FML loads it
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create addon dependency
[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.0.12)"
ordering = "NONE"
side = "BOTH"

# JEI (optional, client-side recipe import + ghost slot drag)
[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "[19.0.0,)"
ordering = "AFTER"
side = "CLIENT"

# EMI (optional, client-side recipe import + ghost slot drag)
[[dependencies."${mod_id}"]]
modId = "emi"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "CLIENT"

# REI (optional, client-side recipe import + ghost slot drag)
[[dependencies."${mod_id}"]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "[16.0.0,)"
ordering = "AFTER"
side = "CLIENT"
